<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lunora</title>
<script>
(function () {
  try {
    var saved = localStorage.getItem("lunora-theme");
    var theme = saved || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    document.documentElement.setAttribute("data-theme", theme);
  } catch (e) {
    document.documentElement.setAttribute("data-theme", "dark");
  }
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12132a;
    --panel: #1b1d40;
    --panel-alt: #242754;
    --border: #34376e;
    --gold: #e8b84a;
    --gold-dim: #b8923a;
    --red: #c24b41;
    --text: #f2eee3;
    --text-dim: #9b9ec0;
    --radius: 7px;
    --font-display: 'Bebas Neue', sans-serif;
    --font-body: 'Inter', system-ui, -apple-system, sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
    --font-pixel: 'Press Start 2P', monospace;
    --night: #0d0e22;
    --sky-1: #2c1b33;
    --sky-2: #3b2a52;
    --sky-3: #2a2f5e;
    --body-glow: #191c3e;
    --error-text: #f4b3ac;
  }

  html[data-theme="light"] {
    --bg: #f5f1e6;
    --panel: #ffffff;
    --panel-alt: #f0ead9;
    --border: #ddd3ba;
    --gold: #b8842a;
    --gold-dim: #96691f;
    --red: #b03a30;
    --text: #2a2418;
    --text-dim: #7a7360;
    --night: #8b93b0;
    --sky-1: #aee1f2;
    --sky-2: #cde9e0;
    --sky-3: #f0e9d0;
    --body-glow: #fffaf0;
    --error-text: #7a2620;
  }

  body, .panel, .card, .chip, .pill, .dropdown, .banner {
    transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: radial-gradient(ellipse at top, var(--body-glow) 0%, var(--bg) 55%);
    color: var(--text);
    font-family: var(--font-body);
    line-height: 1.5;
    min-height: 100vh;
  }

  a { color: var(--gold); }

  :focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }

  .wrap {
    max-width: 980px;
    margin: 0 auto;
    padding: 48px 24px 96px;
  }

  /* ---------- Hero ---------- */

  .hero {
    position: relative;
    overflow: hidden;
    min-height: 560px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 30%, var(--sky-3) 60%, var(--bg) 100%);
  }

  .hero-scene {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 58%;
    display: block;
  }

  .hero-content {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 0 24px;
    margin-top: -30px;
  }

  .hero-social {
    display: flex;
    justify-content: center;
    gap: 22px;
    margin-bottom: 26px;
  }

  .hero-social a {
    width: 24px;
    height: 24px;
    color: var(--text);
    opacity: 0.8;
    transition: opacity 0.15s;
  }
  .hero-social a:hover { opacity: 1; }
  .hero-social svg { width: 100%; height: 100%; }

  .hero-title {
    font-family: var(--font-pixel);
    font-size: clamp(38px, 8.5vw, 84px);
    line-height: 1.3;
    margin: 0;
    color: #fff;
    -webkit-text-stroke: 5px #000;
    paint-order: stroke fill;
    text-shadow: 6px 6px 0 #000;
    letter-spacing: 0.02em;
  }

  .hero-tagline {
    font-family: var(--font-body);
    font-size: 15px;
    color: var(--text);
    opacity: 0.9;
    max-width: 460px;
    margin: 22px auto 32px;
  }

  .hero-cta {
    font-family: var(--font-pixel);
    font-size: 12px;
    background: var(--gold);
    color: #1b1500;
    border: none;
    padding: 16px 26px;
    cursor: pointer;
    box-shadow: 5px 5px 0 #000;
    letter-spacing: 0.03em;
  }

  .hero-cta:hover { background: #f0c565; }

  .hero-cta:active {
    box-shadow: 2px 2px 0 #000;
    transform: translate(3px, 3px);
  }

  .theme-toggle {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 100;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--panel-alt);
    border: 1px solid var(--border);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .theme-toggle:hover { border-color: var(--gold-dim); }

  .theme-toggle svg {
    width: 19px;
    height: 19px;
  }

  html[data-theme="dark"] .theme-toggle .icon-sun { display: none; }
  html[data-theme="light"] .theme-toggle .icon-moon { display: none; }

  html[data-theme="dark"] .hero-social .icon-day { display: none; }
  html[data-theme="light"] .hero-social .icon-night { display: none; }

  .bulbs {
    display: flex;
    justify-content: center;
    gap: 9px;
    margin: 32px 0 24px;
  }

  .bulbs span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--gold-dim);
    opacity: 0.35;
    animation: chase 3.2s ease-in-out infinite;
  }

  .bulbs.loading span { animation-duration: 0.9s; }

  .bulbs span:nth-child(3n+1) { animation-delay: 0s; }
  .bulbs span:nth-child(3n+2) { animation-delay: 0.15s; }
  .bulbs span:nth-child(3n)   { animation-delay: 0.3s; }

  @keyframes chase {
    0%, 100% { opacity: 0.25; background: var(--gold-dim); }
    50% { opacity: 1; background: var(--gold); box-shadow: 0 0 8px var(--gold); }
  }

  @media (prefers-reduced-motion: reduce) {
    .bulbs span { animation: none; opacity: 0.8; }
  }

  /* ---------- Panels ---------- */

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 20px;
  }

  .panel h2 {
    font-family: var(--font-display);
    font-size: 22px;
    letter-spacing: 0.02em;
    margin: 0 0 14px;
    color: var(--text);
  }

  .panel h2 .count {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--text-dim);
    font-weight: 500;
    letter-spacing: 0;
    margin-left: 8px;
  }

  /* ---------- Search ---------- */

  .search-box { position: relative; }

  #search-input {
    width: 100%;
    padding: 13px 16px;
    background: var(--panel-alt);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 15px;
  }

  #search-input::placeholder { color: var(--text-dim); }
  #search-input:disabled { opacity: 0.5; }

  .dropdown {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    background: var(--panel-alt);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    max-height: 440px;
    overflow-y: auto;
    z-index: 10;
    box-shadow: 0 12px 32px rgba(0,0,0,0.45);
  }

  .dropdown-item {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 16px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
  }

  .dropdown-item:last-child { border-bottom: none; }
  .dropdown-item:hover, .dropdown-item.active { background: rgba(232,184,74,0.1); }

  .dropdown-item img, .dropdown-item .poster-ph {
    width: 62px;
    height: 92px;
    object-fit: cover;
    border-radius: 5px;
    background: var(--border);
    flex-shrink: 0;
  }

  .dropdown-item .poster-ph {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 10px;
    color: var(--text-dim);
    padding: 4px;
  }

  .dropdown-item .info { min-width: 0; }
  .dropdown-item .title { font-size: 19px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dropdown-item .year { font-size: 14px; color: var(--text-dim); font-family: var(--font-mono); margin-top: 4px; }

  .dropdown-empty {
    padding: 14px;
    color: var(--text-dim);
    font-size: 13px;
  }

  /* ---------- Ticket chips ---------- */

  .picks {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 16px;
  }

  .chip, .chip-empty {
    width: 190px;
    height: 58px;
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    overflow: hidden;
  }

  .chip {
    background: var(--panel-alt);
    border: 1px solid var(--border);
  }

  .chip img {
    width: 40px;
    height: 58px;
    object-fit: cover;
    flex-shrink: 0;
    background: var(--border);
  }

  .chip .perf {
    align-self: stretch;
    width: 1px;
    background-image: radial-gradient(circle, var(--bg) 2px, transparent 2.5px);
    background-size: 100% 10px;
    background-repeat: repeat-y;
    background-color: var(--border);
  }

  .chip .chip-body {
    flex: 1;
    min-width: 0;
    padding: 0 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }

  .chip .chip-title {
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .chip button {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    padding: 4px;
    flex-shrink: 0;
  }

  .chip button:hover { color: var(--red); }

  .chip-empty {
    border: 1px dashed var(--border);
    color: var(--text-dim);
    font-size: 13px;
    justify-content: center;
  }

  /* ---------- Filters ---------- */

  .filter-group { margin-bottom: 18px; }
  .filter-group:last-child { margin-bottom: 0; }

  .filter-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    margin-bottom: 10px;
  }

  .pills {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .pill {
    background: var(--panel-alt);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 13px;
    cursor: pointer;
    font-family: var(--font-body);
  }

  .pill:hover { border-color: var(--gold-dim); color: var(--text); }

  .pill.active {
    background: var(--gold);
    border-color: var(--gold);
    color: #1b1500;
    font-weight: 600;
  }

  .pill .hint {
    display: block;
    font-size: 10.5px;
    opacity: 0.75;
    font-weight: 400;
  }

  /* ---------- Action ---------- */

  .action-row {
    display: flex;
    align-items: center;
    gap: 16px;
    justify-content: center;
    margin: 8px 0 36px;
  }

  #go-btn {
    background: var(--gold);
    color: #1b1500;
    border: none;
    border-radius: var(--radius);
    padding: 14px 32px;
    font-family: var(--font-display);
    font-size: 18px;
    letter-spacing: 0.04em;
    cursor: pointer;
  }

  #go-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  #go-btn:not(:disabled):hover { background: #f0c565; }

  /* ---------- Messages ---------- */

  .banner {
    border-radius: var(--radius);
    padding: 14px 18px;
    font-size: 14px;
    margin-bottom: 20px;
  }

  .banner.error {
    background: rgba(194,75,65,0.12);
    border: 1px solid var(--red);
    color: var(--error-text);
  }

  .banner.info {
    background: var(--panel-alt);
    border: 1px solid var(--border);
    color: var(--text-dim);
    text-align: center;
  }

  /* ---------- Results ---------- */

  #results h2 { text-align: center; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 18px;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    position: relative;
  }

  .card .poster {
    width: 100%;
    aspect-ratio: 2 / 3;
    object-fit: cover;
    background: var(--panel-alt);
    display: block;
  }

  .card .poster-fallback {
    width: 100%;
    aspect-ratio: 2 / 3;
    background: var(--panel-alt);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 10px;
    font-size: 13px;
    color: var(--text-dim);
  }

  .card .score {
    position: absolute;
    top: 8px;
    right: 8px;
    background: rgba(18,19,42,0.85);
    border: 1px solid var(--gold);
    color: var(--gold);
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 600;
    padding: 3px 7px;
    border-radius: 4px;
  }

  .card .body { padding: 10px 12px 14px; }

  .card .title {
    font-size: 14px;
    font-weight: 600;
    margin: 0 0 2px;
  }

  .card .year {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-dim);
    margin: 0 0 8px;
  }

  .card .genres {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }

  .card .genres span {
    font-size: 10.5px;
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 8px;
  }

  .card .type-badge {
    position: absolute;
    top: 8px;
    left: 8px;
    background: rgba(18,19,42,0.85);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 10.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 3px 7px;
    border-radius: 4px;
  }

  .card .watch {
    margin: 8px 0 0;
    font-size: 11.5px;
    color: var(--text-dim);
    line-height: 1.4;
  }

  .card .watch-type {
    color: var(--gold);
    font-weight: 600;
  }

  .sentinel {
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    padding: 24px 0 8px;
    min-height: 1.4em;
  }

  footer {
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
    margin-top: 48px;
  }
</style>
</head>
<body>

<button class="theme-toggle" id="theme-toggle" aria-label="Toggle light and dark mode" title="Toggle light and dark mode">
  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
</button>

<section class="hero">
  <svg class="hero-scene" viewBox="0 0 1600 420" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <defs>
      <filter id="winGlow" x="-100%" y="-100%" width="300%" height="300%">
        <feGaussianBlur stdDeviation="3" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    <g fill="#4b4a86" opacity="0.5">
      <rect x="230" y="120" width="50" height="220"/>

      <rect x="372" y="150" width="40" height="190"/>

      <rect x="404" y="138" width="8" height="14"/>
    </g>

    <g fill="var(--night)">
      <polygon points="20,420 20,300 45,260 70,300 70,420"/>
      <polygon points="1530,420 1530,290 1555,250 1580,290 1580,420"/>
      <polygon points="60,420 60,340 80,310 100,340 100,420"/>
      <polygon points="1500,420 1500,330 1520,300 1540,330 1540,420"/>
    </g>

    <path fill="var(--night)" d="M0,420 L0,300 L70,300 L70,230 L130,230 L165,150 L200,230 L280,230 L280,270 L360,270 L360,190 L420,190 L455,120 L490,190 L560,190 L560,250 L640,250 L640,210 L700,210 L735,140 L770,210 L850,210 L850,270 L930,270 L930,220 L990,220 L1025,160 L1060,220 L1130,220 L1130,280 L1210,280 L1210,230 L1270,230 L1305,160 L1340,230 L1420,230 L1420,290 L1500,290 L1500,240 L1560,240 L1560,420 Z"/>
    <g fill="var(--night)">
      <rect x="158" y="108" width="14" height="45"/>
      <rect x="448" y="82" width="14" height="40"/>
      <rect x="1298" y="122" width="14" height="40"/>
    </g>

    <g fill="var(--gold)" filter="url(#winGlow)">
      <rect x="28" y="340" width="8" height="8"/>
      <rect x="52" y="340" width="8" height="8"/>
      <rect x="95" y="260" width="8" height="8"/>
      <rect x="118" y="260" width="8" height="8"/>
      <rect x="163" y="180" width="7" height="7"/>
      <rect x="222" y="260" width="8" height="8"/>
      <rect x="252" y="260" width="8" height="8"/>
      <rect x="300" y="300" width="8" height="8"/>
      <rect x="330" y="300" width="8" height="8"/>

      <rect x="400" y="220" width="8" height="8"/>
      <rect x="453" y="150" width="7" height="7"/>
      <rect x="500" y="220" width="8" height="8"/>
      <rect x="580" y="280" width="8" height="8"/>
      <rect x="610" y="280" width="8" height="8"/>
      <rect x="660" y="240" width="8" height="8"/>

      <rect x="733" y="180" width="7" height="7"/>
      <rect x="790" y="240" width="8" height="8"/>

      <rect x="900" y="300" width="8" height="8"/>

      <rect x="1075" y="250" width="8" height="8"/>
      <rect x="1150" y="310" width="8" height="8"/>
      <rect x="1230" y="260" width="8" height="8"/>
      <rect x="1303" y="190" width="7" height="7"/>
      <rect x="1360" y="260" width="8" height="8"/>
      <rect x="1440" y="320" width="8" height="8"/>
      <rect x="1470" y="320" width="8" height="8"/>
      <rect x="1520" y="270" width="8" height="8"/>
    </g>
  </svg>

  <div class="hero-content">
    <div class="hero-social">
      <a href="#" aria-label="Moon" class="icon-night"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg></a>
      <a href="#" aria-label="Star" class="icon-night"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v6M12 15v6M3 12h6M15 12h6M6 6l4 4M14 14l4 4M18 6l-4 4M10 14l-4 4"/></svg></a>
      <a href="#" aria-label="Sun" class="icon-day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></a>
      <a href="#" aria-label="Cloud" class="icon-day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 18a4 4 0 1 1 .7-7.94A5.5 5.5 0 0 1 18 12a3.5 3.5 0 0 1 0 6H7z"/></svg></a>
    </div>
    <h1 class="hero-title">LUNORA</h1>
    <p class="hero-tagline">Pick a few films, name a feeling, and find ten more to watch tonight.</p>
    <button class="hero-cta" id="hero-cta-btn">START EXPLORING</button>
  </div>
</section>

<div class="wrap">

  <div class="bulbs" id="bulbs">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <div id="connection-banner"></div>

  <section class="panel">
    <h2>Your picks <span class="count" id="pick-count">0 of 5</span></h2>
    <div class="search-box">
      <input id="search-input" type="text" placeholder="Search a movie or show you love..." autocomplete="off">
      <div class="dropdown" id="dropdown" hidden></div>
    </div>
    <div class="picks" id="picks"></div>
  </section>

  <section class="panel">
    <h2>Filters</h2>
    <div class="filter-group">
      <div class="filter-label">Media Type</div>
      <div class="pills" id="type-pills"></div>
    </div>
    <div class="filter-group">
      <div class="filter-label">Mood</div>
      <div class="pills" id="mood-pills"></div>
    </div>
    <div class="filter-group">
      <div class="filter-label">Genre</div>
      <div class="pills" id="genre-pills"></div>
    </div>
  </section>

  <div class="action-row">
    <button id="go-btn" disabled>Get recommendations</button>
  </div>

  <section id="results"></section>

  <footer>Running against your local Lunora API.</footer>

</div>

<script>
  const API_BASE = "http://127.0.0.1:8000";
  const IMG_BASE = "https://image.tmdb.org/t/p/w300";
  const WATCH_REGION_LABEL = "the US";  // matches WATCH_REGION in api.py

  // Short hints shown under each mood pill — mirrors mood_config.py so the
  // filter is self-explanatory without a second API round trip.
  const MOOD_HINTS = {
    "Cozy": "comedy, family", "Feel-Good": "comedy, music",
    "Slice of Life": "drama, romance", "Thrilling": "action, thriller",
    "Tense": "thriller, mystery", "Spooky": "horror, mystery",
    "Dark & Gritty": "crime, thriller", "Romantic": "romance, drama",
    "Heartwarming": "family, drama", "Adventurous": "adventure, fantasy",
    "Epic": "action, adventure", "Mind-Bending": "sci-fi, mystery",
    "Nostalgic": "drama, music", "Chill": "documentary, drama",
    "Wholesome": "family, animation", "Historical": "history, war",
    "Whimsical": "fantasy, animation", "Intense Action": "action, war",
  };

  const state = {
    picks: [],        // up to 5 { tmdb_id, title, year, poster_path, genres, media_type }
    genres: [],
    moods: [],
    mediaTypes: [],
    selectedGenres: new Set(),
    selectedMood: null,
    selectedMediaType: null,
    dropdownResults: [],
    offset: 0,
    hasMore: false,
    loadingMore: false,
    lastRequestBody: null,
    scrollObserver: null,
  };

  const el = {
    bulbs: document.getElementById("bulbs"),
    banner: document.getElementById("connection-banner"),
    searchInput: document.getElementById("search-input"),
    dropdown: document.getElementById("dropdown"),
    picks: document.getElementById("picks"),
    pickCount: document.getElementById("pick-count"),
    moodPills: document.getElementById("mood-pills"),
    genrePills: document.getElementById("genre-pills"),
    typePills: document.getElementById("type-pills"),
    goBtn: document.getElementById("go-btn"),
    results: document.getElementById("results"),
  };

  function showBanner(message, type = "error") {
    el.banner.innerHTML = `<div class="banner ${type}">${message}</div>`;
  }
  function clearBanner() { el.banner.innerHTML = ""; }

  async function apiGet(path) {
    const res = await fetch(`${API_BASE}${path}`);
    if (!res.ok) throw new Error(`${res.status}`);
    return res.json();
  }

  async function apiPost(path, body) {
    const res = await fetch(`${API_BASE}${path}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!res.ok) {
      const detail = await res.json().catch(() => ({}));
      throw new Error(detail.detail || `${res.status}`);
    }
    return res.json();
  }

  function posterUrl(path) {
    return path ? `${IMG_BASE}${path}` : null;
  }

  // ---------- Init: load genres + moods ----------

  async function init() {
    try {
      const [genres, moods, mediaTypes] = await Promise.all([
        apiGet("/genres"),
        apiGet("/moods"),
        apiGet("/media-types"),
      ]);
      state.genres = genres;
      state.moods = moods;
      state.mediaTypes = mediaTypes;
      renderGenrePills();
      renderMoodPills();
      renderTypePills();
      el.searchInput.disabled = false;
    } catch (e) {
      el.searchInput.disabled = true;
      showBanner(
        `Can't reach the Lunora server. Make sure <code>uvicorn api:app --reload</code> ` +
        `is running on your machine, then reload this page.`
      );
    }
  }

  document.getElementById("theme-toggle").addEventListener("click", () => {
    const current = document.documentElement.getAttribute("data-theme") || "dark";
    const next = current === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("lunora-theme", next); } catch (e) {}
  });

  document.getElementById("hero-cta-btn").addEventListener("click", () => {
    document.querySelector(".wrap").scrollIntoView({ behavior: "smooth", block: "start" });
    setTimeout(() => el.searchInput.focus(), 400);
  });

  function updateGoButtonState() {
    const hasInput = state.picks.length > 0 || state.selectedGenres.size > 0
      || !!state.selectedMood || !!state.selectedMediaType;
    el.goBtn.disabled = !hasInput;
  }

  function renderTypePills() {
    el.typePills.innerHTML = state.mediaTypes.map(t =>
      `<button class="pill" data-type="${t}">${t}</button>`
    ).join("");
    el.typePills.querySelectorAll(".pill").forEach(btn => {
      btn.addEventListener("click", () => {
        const t = btn.dataset.type;
        const wasActive = state.selectedMediaType === t;
        el.typePills.querySelectorAll(".pill").forEach(b => b.classList.remove("active"));
        state.selectedMediaType = wasActive ? null : t;
        if (!wasActive) btn.classList.add("active");
        updateGoButtonState();
      });
    });
  }

  function renderGenrePills() {
    el.genrePills.innerHTML = state.genres.map(g =>
      `<button class="pill" data-genre="${g}">${g}</button>`
    ).join("");
    el.genrePills.querySelectorAll(".pill").forEach(btn => {
      btn.addEventListener("click", () => {
        const g = btn.dataset.genre;
        if (state.selectedGenres.has(g)) {
          state.selectedGenres.delete(g);
          btn.classList.remove("active");
        } else {
          state.selectedGenres.add(g);
          btn.classList.add("active");
        }
        updateGoButtonState();
      });
    });
  }

  function renderMoodPills() {
    el.moodPills.innerHTML = state.moods.map(m => `
      <button class="pill" data-mood="${m}">
        ${m}
        <span class="hint">${MOOD_HINTS[m] || ""}</span>
      </button>
    `).join("");
    el.moodPills.querySelectorAll(".pill").forEach(btn => {
      btn.addEventListener("click", () => {
        const m = btn.dataset.mood;
        const wasActive = state.selectedMood === m;
        el.moodPills.querySelectorAll(".pill").forEach(b => b.classList.remove("active"));
        state.selectedMood = wasActive ? null : m;
        if (!wasActive) btn.classList.add("active");
        updateGoButtonState();
      });
    });
  }

  // ---------- Search ----------

  let searchTimer = null;
  el.searchInput.addEventListener("input", () => {
    clearTimeout(searchTimer);
    const q = el.searchInput.value.trim();
    if (q.length < 2) { hideDropdown(); return; }
    searchTimer = setTimeout(() => runSearch(q), 300);
  });

  el.searchInput.addEventListener("focus", () => {
    if (state.dropdownResults.length) showDropdown();
  });

  document.addEventListener("click", (e) => {
    if (!e.target.closest(".search-box")) hideDropdown();
  });

  async function runSearch(q) {
    try {
      const results = await apiGet(`/search?q=${encodeURIComponent(q)}`);
      state.dropdownResults = results;
      renderDropdown(results);
    } catch (e) {
      // A failed search shouldn't nuke the whole page — just show nothing.
      state.dropdownResults = [];
      renderDropdown([]);
    }
  }

  function renderDropdown(results) {
    if (!results.length) {
      el.dropdown.innerHTML = `<div class="dropdown-empty">No matches. Try a different title.</div>`;
    } else {
      el.dropdown.innerHTML = results.map(r => `
        <div class="dropdown-item" data-id="${r.tmdb_id}">
          ${posterUrl(r.poster_path)
            ? `<img src="${posterUrl(r.poster_path)}" alt="">`
            : `<div class="poster-ph">${r.title}</div>`}
          <div class="info">
            <div class="title">${r.title} ${r.media_type === "tv" ? '<span class="year">· TV</span>' : ""}</div>
            <div class="year">${r.year || ""}</div>
          </div>
        </div>
      `).join("");
      el.dropdown.querySelectorAll(".dropdown-item").forEach(item => {
        item.addEventListener("click", () => {
          const id = Number(item.dataset.id);
          const movie = results.find(r => r.tmdb_id === id);
          addPick(movie);
        });
      });
    }
    showDropdown();
  }

  function showDropdown() { el.dropdown.hidden = false; }
  function hideDropdown() { el.dropdown.hidden = true; }

  // ---------- Picks ----------

  function addPick(movie) {
    if (state.picks.length >= 5) return;
    if (state.picks.some(p => p.tmdb_id === movie.tmdb_id)) return;
    state.picks.push(movie);
    el.searchInput.value = "";
    hideDropdown();
    renderPicks();
  }

  function removePick(id) {
    state.picks = state.picks.filter(p => p.tmdb_id !== id);
    renderPicks();
  }

  function renderPicks() {
    el.pickCount.textContent = `${state.picks.length} of 5`;
    const chips = state.picks.map(p => `
      <div class="chip">
        ${posterUrl(p.poster_path)
          ? `<img src="${posterUrl(p.poster_path)}" alt="">`
          : `<div style="width:40px;height:58px;background:var(--border);flex-shrink:0;"></div>`}
        <div class="perf"></div>
        <div class="chip-body">
          <span class="chip-title">${p.title}</span>
          <button data-id="${p.tmdb_id}" aria-label="Remove ${p.title}">&times;</button>
        </div>
      </div>
    `).join("");
    const emptySlots = Array.from({ length: 5 - state.picks.length })
      .map(() => `<div class="chip-empty">Pick a film</div>`).join("");
    el.picks.innerHTML = chips + emptySlots;
    el.picks.querySelectorAll(".chip button").forEach(btn => {
      btn.addEventListener("click", () => removePick(Number(btn.dataset.id)));
    });
    updateGoButtonState();
  }

  // ---------- Recommend ----------

  el.goBtn.addEventListener("click", () => getRecommendations(true));

  async function getRecommendations(fresh) {
    clearBanner();
    if (state.scrollObserver) { state.scrollObserver.disconnect(); state.scrollObserver = null; }
    el.goBtn.disabled = true;
    el.bulbs.classList.add("loading");
    el.results.innerHTML = "";
    state.offset = 0;

    const body = {
      movies: state.picks.map(p => ({
        tmdb_id: p.tmdb_id,
        title: p.title,
        genres: p.genres,
      })),
      limit: 10,
      offset: 0,
    };
    if (state.selectedGenres.size) body.genres = Array.from(state.selectedGenres);
    if (state.selectedMood) body.mood = state.selectedMood;
    if (state.selectedMediaType) body.media_type = state.selectedMediaType;
    state.lastRequestBody = body;

    try {
      const data = await apiPost("/recommend", body);
      state.offset = data.results.length;
      state.hasMore = data.has_more;
      renderResults(data.results, false);
      if (state.hasMore) setupInfiniteScroll();
    } catch (e) {
      showBanner(`Couldn't get recommendations: ${e.message}. Check the server terminal for details.`);
    } finally {
      updateGoButtonState();
      el.bulbs.classList.remove("loading");
    }
  }

  function setupInfiniteScroll() {
    const sentinel = document.getElementById("scroll-sentinel");
    if (!sentinel) return;
    state.scrollObserver = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting) loadMore();
    }, { rootMargin: "400px" });
    state.scrollObserver.observe(sentinel);
  }

  async function loadMore() {
    if (state.loadingMore || !state.hasMore || !state.lastRequestBody) return;
    state.loadingMore = true;
    const sentinel = document.getElementById("scroll-sentinel");
    if (sentinel) sentinel.textContent = "Loading more...";

    try {
      const body = { ...state.lastRequestBody, offset: state.offset };
      const data = await apiPost("/recommend", body);
      state.offset += data.results.length;
      state.hasMore = data.has_more;
      renderResults(data.results, true);
      if (!state.hasMore && state.scrollObserver) {
        state.scrollObserver.disconnect();
        const s = document.getElementById("scroll-sentinel");
        if (s) s.textContent = "That's everything for these filters.";
      } else if (sentinel) {
        sentinel.textContent = "";
      }
    } catch (e) {
      if (sentinel) sentinel.textContent = "Couldn't load more — scroll up and try again.";
    } finally {
      state.loadingMore = false;
    }
  }

  function watchLine(w) {
    if (!w || !w.type || !w.providers.length) {
      return `<p class="watch">Not currently available to watch in ${WATCH_REGION_LABEL}</p>`;
    }
    const names = w.providers.slice(0, 3).join(", ");
    return `<p class="watch"><span class="watch-type">${w.type}:</span> ${names}</p>`;
  }

  function renderResults(recs, append) {
    if (!append && !recs.length) {
      el.results.innerHTML = `<div class="banner info">No matches found with these filters — try loosening the genre or mood filter.</div>`;
      return;
    }

    const cardsHtml = recs.map(r => `
      <div class="card">
        ${posterUrl(r.poster_path)
          ? `<img class="poster" src="${posterUrl(r.poster_path)}" alt="${r.title} poster">`
          : `<div class="poster-fallback">${r.title}</div>`}
        <div class="score">${Math.round(r.similarity * 100)}%</div>
        <div class="type-badge">${r.content_type}</div>
        <div class="body">
          <p class="title">${r.title}</p>
          <p class="year">${r.year || ""}</p>
          <div class="genres">${(r.genres || []).slice(0, 3).map(g => `<span>${g}</span>`).join("")}</div>
          ${watchLine(r.where_to_watch)}
        </div>
      </div>
    `).join("");

    if (append) {
      const grid = el.results.querySelector(".grid");
      const sentinel = document.getElementById("scroll-sentinel");
      if (grid) grid.insertAdjacentHTML("beforeend", cardsHtml);
      if (sentinel) sentinel.textContent = "";
    } else {
      el.results.innerHTML = `
        <h2>Recommended for you</h2>
        <div class="grid">${cardsHtml}</div>
        <div id="scroll-sentinel" class="sentinel"></div>
      `;
    }
  }

  init();
</script>

</body>
</html>
